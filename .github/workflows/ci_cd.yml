name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: "3.14"
  DOCUMENTATION_CNAME: "pypim.docs.pyansys.com"
  LIBRARY_NAME: "ansys-platform-instancemanagement"
  LIBRARY_NAMESPACE: "ansys.platform.instancemanagement"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-vulnerabilities:
    name: "Check library vulnerabilities"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    steps:
      - uses: ansys/actions/check-vulnerabilities@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          python-package-name: ${{ env.LIBRARY_NAME }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}

  actions-security:
    name: "Check actions security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'
          trust-ansys-actions: false

  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - name: "Run PyAnsys code style checks"
        uses: ansys/actions/code-style@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0

  doc-style:
    name: "Doc style"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required for Vale to add review comments and suggestions on pull requests
    steps:
      - name: "Run Ansys documentation style checks"
        uses: ansys/actions/doc-style@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-build:
    name: "Doc building"
    runs-on: ubuntu-latest
    needs: doc-style
    steps:
      - name: "Run Ansys documentation building action"
        uses: ansys/actions/doc-build@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  wheelhouse:
    name: "Wheelhouse Python ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: code-style
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        should-release:
          - ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}
        exclude:
          - should-release: false
            os: macos-latest
    steps:
      - uses: ansys/actions/build-wheelhouse@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  tests:
    name: "Test ${{ matrix.python-version }} under ${{ matrix.os }}"
    needs: wheelhouse
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: "Test ${{ matrix.python-version }} under ${{ matrix.os }}"
        uses: ansys/actions/tests-pytest@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          pytest-extra-args: "--cov=ansys.platform.instancemanagement --cov-report=term --cov-report=html:.cov/html"

      - name: "Upload coverage to Codecov"
        if: ${{ matrix.python-version ==  env.MAIN_PYTHON_VERSION && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f #v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .cov/xml

  build-library:
    name: "Build library"
    needs: [doc-build, tests]
    runs-on: ubuntu-latest
    steps:
      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          library-name: ${{ env.LIBRARY_NAME }}

  doc-deploy-development:
    name: Doc dev version deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-library
    permissions:
      contents: write # Needed to push documentation to gh-pages branch
    steps:
      - name: "Deploy developers documentation"
        uses: ansys/actions/doc-deploy-dev@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release to private and public PyPI and to GitHub"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [build-library]
    # Scope the trusted-publisher OIDC exchange to a dedicated environment; the
    # PyPI Trusted Publisher must be registered with this same environment name.
    environment: release
    permissions:
      contents: write # Needed to create GitHub releases
      id-token: write # Required for Trusted Publishing (OIDC) to the public PyPI repository.
    steps:
      - name: "Release to the private PyPI repository"
        uses: ansys/actions/release-pypi-private@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          twine-username: "__token__"
          twine-token: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}

      # Trusted Publishing (OIDC) cannot be used from inside the composite
      # ansys/actions/release-pypi-public action, so publish to public PyPI by
      # calling pypa/gh-action-pypi-publish directly. See:
      # https://actions.docs.ansys.com/version/stable/migrations/release-pypi-trusted-publisher.html
      - name: "Download the library artifacts from the build-library job"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Release to the public PyPI repository via trusted publisher"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

      - name: "Release to GitHub"
        uses: ansys/actions/release-github@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog-release-notes: false

  doc-deploy-stable:
    name: Doc stable version deploy
    # Runs automatically on a tag release (after the release job) and can also
    # be triggered manually via workflow_dispatch to (re)deploy the stable docs
    # without re-running the PyPI release jobs.
    if: >-
      always() &&
      needs.doc-build.result == 'success' &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    needs: [doc-build, release]
    permissions:
      contents: write # Needed to push documentation to gh-pages branch
    steps:
      - name: "Deploy stable documentation"
        uses: ansys/actions/doc-deploy-stable@e2075e950bdec40b816670160e98c4c184c7b281 #v11.0.0
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
