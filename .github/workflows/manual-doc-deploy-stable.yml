name: Manual stable doc deploy

# Temporary, manually-triggered workflow to publish the stable (v1.2)
# documentation after the v1.2.0 release pipeline failed on the GitHub
# release step. It rebuilds the docs from this branch and deploys them to
# gh-pages without touching the PyPI release jobs. Remove after use.

on:
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: "3.14"
  DOCUMENTATION_CNAME: "pypim.docs.pyansys.com"

jobs:
  doc-build:
    name: "Doc building"
    runs-on: ubuntu-latest
    steps:
      - name: "Run Ansys documentation building action"
        uses: ansys/actions/doc-build@v10.3.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  doc-deploy-stable:
    name: "Doc stable version deploy"
    runs-on: ubuntu-latest
    needs: doc-build
    permissions:
      contents: write
    steps:
      - name: "Deploy stable documentation"
        uses: ansys/actions/doc-deploy-stable@v10.3.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
